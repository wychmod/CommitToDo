<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    品牌图标与产品顶栏的品牌方块同构：旋转 -8 度的描边方框，内嵌字母 C。
    色值对齐 design/tokens.css 里的 marketing-page 与 marketing-ink 两个变量
    （浅色 #FFFFFF 配 #111111，深色 #1C2431 配 #F2F2F2）。
    图标作为图片独立加载时读不到页面 CSS 变量，只能写字面值，改令牌时同步这里。
    与 web/public/favicon.svg 内容保持一致，两端各自构建部署，需同步修改。
    注意：SVG 是 XML，注释里不能出现连续两个减号。
  -->
  <style>
    .tile { fill: #FFFFFF; }
    .ink { fill: none; stroke: #111111; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1C2431; }
      .ink { fill: none; stroke: #F2F2F2; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="6" />
  <g class="ink" transform="rotate(-8 16 16)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.95" y="5.95" width="20.1" height="20.1" rx="3.2" stroke-width="1.9" />
    <path d="M19.86 12.98A4.9 4.9 0 1 0 19.86 19.02" stroke-width="2.2" />
  </g>
</svg>
