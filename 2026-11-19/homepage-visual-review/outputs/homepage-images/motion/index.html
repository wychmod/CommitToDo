<script>
const options=[{"title":"Codex · 蓝紫光场","prefix":"01-codex"},{"title":"Linear · 活动轨道","prefix":"02-linear"},{"title":"Vercel · 分光棱镜","prefix":"03-vercel"},{"title":"Cursor · 桌面接力","prefix":"04-cursor"},{"title":"Resend · 提交铸件","prefix":"05-resend"},{"title":"Stripe Press · 可翻阅的私人编年","prefix":"06-stripe-press"},{"title":"TRAE · 绿色信号","prefix":"07-trae"},{"title":"语雀 · 会长成分支的手账","prefix":"08-yuque"},{"title":"少数派 · 流动的每日进度报","prefix":"09-sspai"},{"title":"Manus · 一句话到一条记录","prefix":"10-manus"},{"title":"Apple · 双面玻璃展台","prefix":"11-apple"},{"title":"Stripe · 流动色带","prefix":"12-stripe"},{"title":"Figma · 分支画布的选区","prefix":"13-figma"},{"title":"Microsoft · 分层功能展位","prefix":"14-microsoft"},{"title":"Xiaomi · 跑道摄影长镜头","prefix":"15-xiaomi"},{"title":"Huawei · 钛面反射展场","prefix":"16-huawei"},{"title":"阿里云 · 玻璃数据场","prefix":"17-aliyun"},{"title":"飞书 · 可切换发布台","prefix":"18-feishu"},{"title":"Claude · 温纸与微光","prefix":"19-claude"},{"title":"Notion · 贴纸工作间","prefix":"20-notion"},{"title":"Framer · 画布折面","prefix":"21-framer"},{"title":"Runway · 两段路的慢切","prefix":"22-runway"},{"title":"Pentagram · 一个不断展开的个人档案","prefix":"23-pentagram"},{"title":"Teenage Engineering · 桌上任务仪","prefix":"24-teenage-engineering"},{"title":"Aesop · 暖光手稿","prefix":"25-aesop"},{"title":"Porsche · 远路慢推","prefix":"26-porsche"},{"title":"Studio Dumbar · 一次完成的动谱","prefix":"27-studio-dumbar"},{"title":"IKEA · 两束光，一张桌","prefix":"28-ikea"},{"title":"LEGO · 分支装配间","prefix":"29-lego"}];
const select=document.getElementById('choice');
const scene=document.getElementById('scene');
const viewport=scene.parentElement;
const still=document.getElementById('still');
const full=document.getElementById('full');
const light=document.getElementById('light');
const dark=document.getElementById('dark');
let theme='light';
function show(replay=false){
  const entry=options[Number(select.value)];
  const path='preview/'+entry.prefix+'-'+theme+'.html';
  scene.title=entry.title+' · 动效预览';
  scene.src=path+(replay?'?play='+Date.now():'');
  full.href=path;
  still.href=entry.prefix+'-'+theme+'.png';
  light.setAttribute('aria-pressed',String(theme==='light'));
  dark.setAttribute('aria-pressed',String(theme==='dark'));
}
new ResizeObserver(()=>{
  const scale=viewport.clientWidth/1512;
  scene.style.transform='scale('+scale+')';
  viewport.style.height=Math.round(950*scale)+'px';
}).observe(viewport);
select.addEventListener('change',()=>show());
light.addEventListener('click',()=>{theme='light';show()});
dark.addEventListener('click',()=>{theme='dark';show()});
document.getElementById('restart').addEventListener('click',()=>show(true));
for(const button of document.querySelectorAll('[data-choice]')){
  button.addEventListener('click',()=>{
    select.value=button.dataset.choice;
    show();
    document.getElementById('player').scrollIntoView({block:'start'});
  });
}
</script></body></html>
